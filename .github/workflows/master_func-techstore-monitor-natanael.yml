name: Build and deploy Azure Function - func-techstore-monitor-natanael

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  FUNCTION_PROJECT: 'TechStore.Monitoring.Functions/TechStore.Monitoring.Functions.csproj'
  PUBLISH_PATH: './function-publish'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore "${{ env.FUNCTION_PROJECT }}"

      - name: Build Function
        shell: pwsh
        run: dotnet build "${{ env.FUNCTION_PROJECT }}" --configuration Release --no-restore

      - name: Publish Function
        shell: pwsh
        run: dotnet publish "${{ env.FUNCTION_PROJECT }}" --configuration Release --no-build --output "${{ env.PUBLISH_PATH }}"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7DE65E4A5F794DFFAB6D22E6F1CBC889 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8E9217A3F8EC4FEF84254BEEEDDD9048 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6CFA690454354AF08A29D602AB230F73 }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'func-techstore-monitor-natanael'
          package: ${{ env.PUBLISH_PATH }}
